    // 2. Global State & Variables
    let map = null;
    let markers = [];
    let activeFarmIndex = null;
    let filteredFarms = [...farmData];

    // Initialize Page on Load
    window.onload = function() {
      initMap();
      populateCountyDropdown();
      renderFarmCards(farmData);
      plotMarkers(farmData);
      setupEventListeners();
    };

    // 3. Initialize Leaflet Map
    function initMap() {
      // Taiwan Center Lat/Lng
      map = L.map('map', {
        zoomControl: false
      }).setView([23.8, 120.9], 8);

      // Add Zoom Control to Top Right
      L.control.zoom({ position: 'topright' }).addTo(map);

      // OpenStreetMap Tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
    }

    // 4. Populate County Select Dropdown
    function populateCountyDropdown() {
      const countySelect = document.getElementById('countySelect');
      const counties = [...new Set(farmData.map(item => item.County))];
      
      counties.forEach(county => {
        const option = document.createElement('option');
        option.value = county;
        option.textContent = `📍 ${county}`;
        countySelect.appendChild(option);
      });
    }

    // 5. Custom Wooden/Green Leaflet Icon Marker
    function createCustomMarkerIcon(isSelected = false) {
      const color = isSelected ? '#E09200' : '#5B8C51';
      const scale = isSelected ? 'scale(1.25)' : 'scale(1)';
      
      const svgIcon = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="34" height="46" style="transform: ${scale}; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.3)); transition: all 0.2s ease;">
          <path fill="${color}" stroke="#7C5237" stroke-width="18" d="M172.268 501.67C26.97 291.031 0 269.413 0 192 0 85.961 85.961 0 192 0s192 85.961 192 192c0 77.413-26.97 99.031-172.268 309.67-9.535 13.774-29.93 13.773-39.464 0z"/>
          <circle cx="192" cy="192" r="120" fill="#FAF6EE" />
          <text x="192" y="225" font-size="130" text-anchor="middle">🌾</text>
        </svg>
      `;

      return L.divIcon({
        className: 'custom-farm-icon',
        html: svgIcon,
        iconSize: [34, 46],
        iconAnchor: [17, 46],
        popupAnchor: [0, -42]
      });
    }

    // 6. Render Sidebar Farm Cards
    function renderFarmCards(farms) {
      const container = document.getElementById('farmList');
      const countEl = document.getElementById('farmCount');
      
      container.innerHTML = '';
      countEl.textContent = farms.length;

      if (farms.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 px-4">
            <span class="text-4xl">🧑‍🌾</span>
            <p class="mt-2 text-farm-brown font-bold text-base">沒有找到符合的農場喔！</p>
            <p class="text-xs text-stone-500 mt-1">請嘗試換個搜尋關鍵字或選擇其他縣市。</p>
          </div>
        `;
        return;
      }

      farms.forEach((farm, index) => {
        const originalIndex = farmData.indexOf(farm);
        const card = document.createElement('div');
        
        card.id = `farm-card-${originalIndex}`;
        card.className = `farm-card bg-farm-cream-card border-2 border-farm-brown-light/60 rounded-2xl p-3.5 shadow-sm hover:shadow-md cursor-pointer transition-all duration-200 relative overflow-hidden group ${activeFarmIndex === originalIndex ? 'active' : ''}`;
        
        // Parse Service Badges (First 3 items)
        const services = farm.ServeItem.split(',').map(s => s.trim());
        const badgeTags = services.slice(0, 3).map(s => 
          `<span class="inline-block bg-farm-green-light text-farm-green-dark border border-farm-green/30 text-[11px] px-2 py-0.5 rounded-md font-semibold mr-1 mb-1">🌱 ${s}</span>`
        ).join('');

        card.innerHTML = `
          <div class="flex justify-between items-start mb-1.5">
            <h3 class="text-base font-bold text-farm-brown font-rural group-hover:text-farm-green transition-colors flex items-center gap-1.5">
              <span>🏡</span> ${farm.FarmNm_CH}
            </h3>
            <span class="text-xs bg-farm-brown-light/40 text-farm-brown px-2 py-0.5 rounded-full font-bold shrink-0">
              ${farm.County}${farm.Township}
            </span>
          </div>

          <p class="text-xs text-stone-600 mb-2 line-clamp-1">
            <i class="fa-solid fa-location-dot text-farm-brown/70 mr-1.5 w-3"></i>${farm.Address_CH}
          </p>

          <p class="text-xs text-stone-600 mb-2">
            <i class="fa-solid fa-phone text-farm-brown/70 mr-1.5 w-3"></i>
            <a href="tel:${farm.TEL}" class="hover:underline font-bold text-farm-brown" onclick="event.stopPropagation()">${farm.TEL}</a>
          </p>

          <div class="mb-2">
            ${badgeTags}
            ${services.length > 3 ? `<span class="text-[10px] text-stone-400 font-bold">+${services.length - 3}更多</span>` : ''}
          </div>

          <!-- Quick Action Buttons -->
          <div class="flex items-center gap-2 pt-2 border-t border-stone-100 mt-2">
            ${farm.WebURL ? `
              <a href="${farm.WebURL}" target="_blank" onclick="event.stopPropagation()" class="flex-1 text-center bg-farm-brown/10 hover:bg-farm-brown hover:text-white text-farm-brown text-xs py-1.5 px-2 rounded-lg font-bold transition-all">
                <i class="fa-solid fa-globe mr-1"></i>官方網站
              </a>
            ` : ''}
            ${farm.Facebook ? `
              <a href="${farm.Facebook}" target="_blank" onclick="event.stopPropagation()" class="flex-1 text-center bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-700 text-xs py-1.5 px-2 rounded-lg font-bold transition-all">
                <i class="fa-brands fa-facebook mr-1"></i>FB粉專
              </a>
            ` : ''}
          </div>
        `;

        // Card Click Handler
        card.onclick = () => selectFarm(originalIndex, true);
        container.appendChild(card);
      });
    }

    // 7. Plot Markers on Leaflet Map
    function plotMarkers(farms) {
      // Clear Existing Markers
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      farms.forEach((farm) => {
        const originalIndex = farmData.indexOf(farm);
        const marker = L.marker([farm.Latitude, farm.Longitude], {
          icon: createCustomMarkerIcon(activeFarmIndex === originalIndex)
        }).addTo(map);

        // Build Leaflet Popup Content
        const popupContent = `
          <div class="w-56 font-body">
            <span class="text-[11px] bg-farm-brown-light/40 text-farm-brown px-2 py-0.5 rounded-full font-bold inline-block mb-1">
              ${farm.County} ‧ ${farm.Township}
            </span>
            <h4 class="text-base font-bold font-rural text-farm-brown mb-1 flex items-center gap-1">
              🏡 ${farm.FarmNm_CH}
            </h4>
            <p class="text-xs text-stone-600 mb-1.5 leading-snug">
              <b>地址:</b> ${farm.Address_CH}
            </p>
            <p class="text-xs text-stone-600 mb-2">
              <b>電話:</b> <a href="tel:${farm.TEL}" class="text-farm-green font-bold underline">${farm.TEL}</a>
            </p>
            <p class="text-xs text-stone-500 bg-farm-cream p-2 rounded-lg border border-farm-brown-light/40 mb-2">
              <b>體驗項目:</b><br>${farm.ServeItem}
            </p>
            <div class="flex gap-1.5">
              ${farm.WebURL ? `<a href="${farm.WebURL}" target="_blank" class="flex-1 text-center bg-farm-green text-white text-[11px] py-1 px-1.5 rounded-md font-bold hover:bg-farm-green-dark">官網</a>` : ''}
              ${farm.Facebook ? `<a href="${farm.Facebook}" target="_blank" class="flex-1 text-center bg-blue-600 text-white text-[11px] py-1 px-1.5 rounded-md font-bold hover:bg-blue-700">FB粉專</a>` : ''}
            </div>
          </div>
        `;

        marker.bindPopup(popupContent);

        // Marker Click Handler
        marker.on('click', () => {
          selectFarm(originalIndex, false);
        });

        markers[originalIndex] = marker;
      });
    }

    // 8. Select Farm (Sync Map & Sidebar)
    function selectFarm(index, flyToMap = true) {
      if (index === null || index === undefined) return;
      
      const farm = farmData[index];
      activeFarmIndex = index;

      // Update Marker Icons highlight
      markers.forEach((m, idx) => {
        if (m) {
          m.setIcon(createCustomMarkerIcon(idx === index));
        }
      });

      // Fly To Map & Open Popup
      if (flyToMap && markers[index]) {
        map.flyTo([farm.Latitude, farm.Longitude], 13, {
          duration: 1.2
        });
        setTimeout(() => {
          markers[index].openPopup();
        }, 400);
      } else if (markers[index]) {
        markers[index].openPopup();
      }

      // Highlight Card & Scroll into view in Sidebar
      document.querySelectorAll('.farm-card').forEach(card => card.classList.remove('active'));
      const activeCard = document.getElementById(`farm-card-${index}`);
      
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // 9. Filter Handler (Search + Dropdown)
    function handleFilter() {
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const countyVal = document.getElementById('countySelect').value;
      const clearBtn = document.getElementById('clearSearchBtn');

      // Toggle Clear Search Button
      if (searchVal) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      filteredFarms = farmData.filter(farm => {
        const matchCounty = (countyVal === 'ALL') || (farm.County === countyVal);
        const matchSearch = !searchVal || 
          farm.FarmNm_CH.toLowerCase().includes(searchVal) ||
          farm.ServeItem.toLowerCase().includes(searchVal) ||
          farm.County.toLowerCase().includes(searchVal) ||
          farm.Township.toLowerCase().includes(searchVal) ||
          farm.Address_CH.toLowerCase().includes(searchVal);

        return matchCounty && matchSearch;
      });

      renderFarmCards(filteredFarms);
      plotMarkers(filteredFarms);

      // Auto fit map bounds if filtered results exist
      if (filteredFarms.length > 0) {
        const bounds = L.latLngBounds(filteredFarms.map(f => [f.Latitude, f.Longitude]));
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
      }
    }

    // 10. Event Listeners Setup
    function setupEventListeners() {
      const searchInput = document.getElementById('searchInput');
      const countySelect = document.getElementById('countySelect');
      const clearSearchBtn = document.getElementById('clearSearchBtn');

      searchInput.addEventListener('input', handleFilter);
      countySelect.addEventListener('change', handleFilter);

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        handleFilter();
        searchInput.focus();
      });
    }
  </script>
